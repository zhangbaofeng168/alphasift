name: AlphaSift Daily Stock


on:

  # 手动测试
  workflow_dispatch:


  # 北京时间每天14:30
  # UTC 06:30

  schedule:

    - cron: "30 6 * * 1-5"



jobs:


  run-stock:


    runs-on: ubuntu-latest



    steps:


    # 拉代码

    - name: Checkout

      uses: actions/checkout@v5



    # Python

    - name: Setup Python

      uses: actions/setup-python@v6

      with:

        python-version: "3.11"



    # 安装

    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        pip install -e .



    # 显示配置

    - name: Show Config

      run: |

        echo "Strategy=${{ vars.ALPHASIFT_STRATEGY }}"

        echo "LLM=${{ vars.LLM_PROVIDER }}"

        echo "Model=${{ vars.LLM_MODEL }}"



    # 执行AlphaSift

    - name: Run AlphaSift


      env:


        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}


        LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}

        LLM_MODEL: ${{ vars.LLM_MODEL }}


      run: |


        if [ "${{ vars.ENABLE_LLM }}" = "false" ]

        then

          echo "LLM disabled"

          alphasift screen ${{ vars.ALPHASIFT_STRATEGY }} --no-llm

        else

          echo "LLM enabled"

          alphasift screen ${{ vars.ALPHASIFT_STRATEGY }}

        fi



    # 保存结果

    - name: Upload Result


      uses: actions/upload-artifact@v5


      with:


        name: alphasift-result-${{ github.run_number }}


        path: |


          reports/


          data/



    # 飞书通知

    - name: Send Feishu Message


      if: always()


      env:


        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}


        STATUS: ${{ job.status }}


      run: |


        python <<EOF

        import os

        import json

        import urllib.request



        webhook=os.environ["FEISHU_WEBHOOK"]

        status=os.environ["STATUS"]



        msg=f"""

        AlphaSift每日选股完成

        状态:
        {status}


        策略:
        ${{ vars.ALPHASIFT_STRATEGY }}


        模型:
        ${{ vars.LLM_MODEL }}


        查看结果:
        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

        """



        data={

            "msg_type":"text",

            "content":{

                "text":msg

            }

        }



        req=urllib.request.Request(

            webhook,

            data=json.dumps(data).encode("utf-8"),

            headers={

                "Content-Type":"application/json"

            }

        )



        urllib.request.urlopen(req)

        EOF
