name: AlphaSift Daily Stock


on:

  workflow_dispatch:


  schedule:

    # 北京时间14:30
    # UTC 06:30

    - cron: "30 6 * * 1-5"



jobs:

  run-stock:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install

      run: |

        python -m pip install --upgrade pip

        pip install -e .



    - name: Load Config

      run: |

        echo "Strategy=${{ vars.ALPHASIFT_STRATEGY }}"

        echo "LLM=${{ vars.LLM_PROVIDER }}"

        echo "Model=${{ vars.LLM_MODEL }}"



    - name: Run AlphaSift


      env:


        # API Keys

        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}



        # LLM配置

        LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}

        LLM_MODEL: ${{ vars.LLM_MODEL }}



        # 策略

        STRATEGY: ${{ vars.ALPHASIFT_STRATEGY }}



      run: |


        if [ "${{ vars.ENABLE_LLM }}" = "false" ]

        then

          echo "LLM disabled"

          alphasift screen $STRATEGY --no-llm


        else

          echo "LLM enabled"

          alphasift screen $STRATEGY


        fi



    - name: Upload Result


      uses: actions/upload-artifact@v4


      with:


        name: alphasift-result-${{ github.run_number }}


        path:


          reports/

